<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白話藥品卡</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="index">
<header class="top"><div class="wrap">
  <a class="brand" href="./">白話藥品卡<small>仿單翻成白話，每句都能對照原文</small></a>
  <div class="sizes" aria-label="字級"><button data-size="m">標準</button><button data-size="l">大</button><button data-size="xl">特大</button></div>
</div></header>
<main class="wrap">
  <div class="notice">⚠️ 本網站為課堂示範，非醫療器材或醫療服務。用藥請依醫師、藥師指示。</div>
  <h1>藥袋上的藥，用白話看懂</h1>
  <p class="sub">每張卡都把食藥署官方仿單改寫成白話，並附上原文讓你自己對照。</p>
  <input id="q" type="search" placeholder="搜尋藥名或用途，例如：高血壓、鎮定錠" aria-label="搜尋藥品">
  <ul id="cards" class="cards"></ul>
  <footer>內容改寫自食藥署公開仿單，僅供衛教參考，不能取代醫師或藥師的專業判斷。</footer>
</main>
<script src="assets/app.js"></script>
</body>
</html>
